name: proving_tool
description: "Prove It — an operational trials app."
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ^3.11.5

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8
  supabase_flutter: ^2.12.4
  file_picker: ^8.1.2
  url_launcher: ^6.3.2
  fl_chart: ^1.2.0
  google_fonts: ^8.1.0
  pdf: ^3.12.0
  printing: ^5.14.3
  drift: ^2.34.3
  sqlite3: ^3.5.0
  path_provider: ^2.1.6
  path: ^1.9.0
  connectivity_plus: ^7.3.1
  uuid: ^4.6.0
  image_picker: ^1.2.3
  csv: ^8.0.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  drift_dev: ^2.34.3
  build_runner: ^2.4.13
  flutter_launcher_icons: ^0.14.4

flutter:
  uses-material-design: true
  assets:
    - assets/logo.png
    - assets/logo_icon.png
    - assets/fonts/Montserrat-Regular.ttf
    - assets/fonts/Montserrat-Bold.ttf

flutter_launcher_icons:
  android: true
  ios: true
  windows:
    generate: true
  image_path: "assets/logo_icon.png"
  min_sdk_android: 21
  # The icon has transparent padding around the eye mark, and Android
  # adaptive icons expect that safe-zone padding baked in already.
  adaptive_icon_background: "#FFFFFF"
  adaptive_icon_foreground: "assets/logo_icon.png"